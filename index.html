<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f1e4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&display=swap" rel="stylesheet" />
    <style>.align-toggle { display: none !important; }</style>
    <title>Vayetsei Rishon · Tikkun</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // The instructor alignment editor lives at /vayetsei/adjust/ only.
      const params = new URLSearchParams(window.location.search);
      if (params.has('align')) {
        params.delete('align');
        const query = params.toString();
        history.replaceState(null, '', window.location.pathname + (query ? `?${query}` : '') + window.location.hash);
      }
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/transliterationEnhancer.js"></script>
  </body>
</html>
